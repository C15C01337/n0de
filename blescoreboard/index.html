<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Lock x picoCTF Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
/* ===== CSS Variables ===== */
:root {
  --bg-dark: #0a0e14;
  --bg-card: #0d1117;
  --bg-card-hover: #161b22;
  --accent-cyan: #39d353;
  --accent-cyan-dim: #26a641;
  --accent-magenta: #ff7b72;
  --accent-yellow: #d29922;
  --accent-blue: #58a6ff;
  --accent-purple: #a371f7;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #6e7681;
  --border-color: #21262d;
  --glow-cyan: 0 0 20px rgba(57, 211, 83, 0.3);
  --glow-magenta: 0 0 20px rgba(255, 123, 114, 0.2);
  --font-display: 'Orbitron', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

/* ===== Reset & Base ===== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
}

body {
  font-family: var(--font-mono);
  background: var(--bg-dark);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ===== Atmospheric Effects ===== */
.scanlines {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 9999;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, 0.03) 2px,
    rgba(0, 0, 0, 0.03) 4px
  );
}

.noise {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 9998;
  opacity: 0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
}

/* ===== Header ===== */
.header {
  padding: 2rem 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1.5rem;
  border-bottom: 1px solid var(--border-color);
  background: linear-gradient(180deg, rgba(13, 17, 23, 0.95) 0%, transparent 100%);
}

.logo {
  display: flex;
  align-items: baseline;
  gap: 0.25rem;
}

.logo-bracket {
  color: var(--accent-cyan);
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 900;
  text-shadow: var(--glow-cyan);
}

.logo-text {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 0.15em;
}

.logo-sub {
  font-family: var(--font-display);
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.4em;
  margin-left: 1rem;
}

.header-meta {
  display: flex;
  align-items: center;
  gap: 1.5rem;
}

.event-name {
  font-size: 0.9rem;
  color: var(--accent-cyan);
  letter-spacing: 0.1em;
}

.refresh-btn {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.6rem 1.2rem;
  background: transparent;
  border: 1px solid var(--accent-cyan);
  color: var(--accent-cyan);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  cursor: pointer;
  transition: all 0.3s ease;
}

.refresh-btn:hover {
  background: var(--accent-cyan);
  color: var(--bg-dark);
  box-shadow: var(--glow-cyan);
}

.refresh-btn svg {
  width: 16px;
  height: 16px;
}

.refresh-btn.loading svg {
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ===== Main Content ===== */
.main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 3rem;
}

.section-title {
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.3em;
  color: var(--text-secondary);
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.title-icon {
  color: var(--accent-cyan);
  font-size: 0.8rem;
}

/* ===== Leaderboard Grid ===== */
.leaderboard-section {
  margin-bottom: 4rem;
}

.leaderboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.5rem;
}

.team-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 1.5rem;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.team-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: var(--accent-cyan);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.team-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--accent-cyan);
  transform: translateY(-2px);
  box-shadow: var(--glow-cyan);
}

.team-card:hover::before {
  opacity: 1;
}

.team-card.rank-1 { --rank-color: #ffd700; }
.team-card.rank-2 { --rank-color: #c0c0c0; }
.team-card.rank-3 { --rank-color: #cd7f32; }

.team-card .rank-badge {
  position: absolute;
  top: 1rem;
  right: 1rem;
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 900;
  color: var(--rank-color, var(--text-muted));
  opacity: 0.8;
}

.team-card .team-name {
  font-family: var(--font-display);
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 0.5rem;
  letter-spacing: 0.05em;
}

.team-card .team-score {
  font-size: 2rem;
  font-weight: 700;
  color: var(--accent-cyan);
  text-shadow: 0 0 10px rgba(57, 211, 83, 0.3);
}

.team-card .team-link {
  display: inline-block;
  margin-top: 1rem;
  font-size: 0.75rem;
  color: var(--accent-blue);
  text-decoration: none;
  opacity: 0.8;
  transition: opacity 0.2s;
}

.team-card .team-link:hover {
  opacity: 1;
  text-decoration: underline;
}

/* ===== Team Detail Cards ===== */
.teams-detail-section {
  margin-bottom: 2rem;
}

.teams-detail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 1.5rem;
}

.team-detail-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  overflow: hidden;
  transition: all 0.3s ease;
}

.team-detail-card:hover {
  border-color: var(--accent-cyan);
  box-shadow: var(--glow-cyan);
}

.team-detail-header {
  padding: 1.25rem 1.5rem;
  background: linear-gradient(135deg, rgba(57, 211, 83, 0.08) 0%, transparent 100%);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.team-detail-name {
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 0.05em;
}

.team-detail-total {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--accent-cyan);
}

.members-list {
  padding: 1rem 1.5rem;
}

.member-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.75rem 0;
  border-bottom: 1px solid var(--border-color);
  transition: background 0.2s;
}

.member-row:last-child {
  border-bottom: none;
}

.member-row:hover {
  background: rgba(57, 211, 83, 0.03);
}

.member-info {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.member-username {
  font-weight: 600;
  color: var(--text-primary);
}

.member-leader-badge {
  font-size: 0.65rem;
  padding: 0.15rem 0.4rem;
  background: var(--accent-magenta);
  color: var(--bg-dark);
  border-radius: 4px;
  font-weight: 700;
  letter-spacing: 0.05em;
}

.member-score {
  font-weight: 700;
  color: var(--accent-cyan);
  font-size: 1rem;
}

/* ===== Footer ===== */
.footer {
  text-align: center;
  padding: 2rem 3rem;
  border-top: 1px solid var(--border-color);
  color: var(--text-muted);
  font-size: 0.8rem;
}

.footer a {
  color: var(--accent-cyan);
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

.last-update {
  margin-top: 0.5rem;
}

/* ===== Loading Overlay ===== */
.loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(10, 14, 20, 0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10000;
  transition: opacity 0.4s ease, visibility 0.4s ease;
}

.loading-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.loader {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
}

.loader-ring {
  width: 60px;
  height: 60px;
  border: 3px solid var(--border-color);
  border-top-color: var(--accent-cyan);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.loader-text {
  font-family: var(--font-display);
  font-size: 0.8rem;
  letter-spacing: 0.3em;
  color: var(--accent-cyan);
}

/* ===== Error State ===== */
.error-message {
  background: rgba(255, 123, 114, 0.1);
  border: 1px solid var(--accent-magenta);
  color: var(--accent-magenta);
  padding: 1.5rem;
  border-radius: 8px;
  text-align: center;
  margin: 2rem 0;
}

/* ===== Animations ===== */
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.team-card,
.team-detail-card {
  animation: fadeInUp 0.5s ease forwards;
}

.team-card:nth-child(1) { animation-delay: 0.05s; }
.team-card:nth-child(2) { animation-delay: 0.1s; }
.team-card:nth-child(3) { animation-delay: 0.15s; }
.team-card:nth-child(4) { animation-delay: 0.2s; }
.team-detail-card:nth-child(1) { animation-delay: 0.1s; }
.team-detail-card:nth-child(2) { animation-delay: 0.15s; }
.team-detail-card:nth-child(3) { animation-delay: 0.2s; }
.team-detail-card:nth-child(4) { animation-delay: 0.25s; }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .header {
    padding: 1.5rem 1.5rem;
  }

  .logo-text, .logo-bracket {
    font-size: 1.5rem;
  }

  .main {
    padding: 1.5rem;
  }

  .leaderboard-grid,
  .teams-detail-grid {
    grid-template-columns: 1fr;
  }
}
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="noise"></div>
  
  <header class="header">
    <div class="logo">
      <span class="logo-bracket">[</span>
      <span class="logo-text">Blue Lock x picoCTF</span>
      <span class="logo-bracket">]</span>
      <span class="logo-sub">LEADERBOARD</span>
    </div>
    <div class="header-meta">
      <span class="event-name" id="eventName">picoCTF 2026</span>
      <button class="refresh-btn" id="refreshBtn" aria-label="Refresh scores">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        <span>REFRESH</span>
      </button>
    </div>
  </header>

  <main class="main">
    <section class="leaderboard-section">
      <h2 class="section-title">
        <span class="title-icon">▸</span>
        TEAM RANKINGS
      </h2>
      <div class="leaderboard-grid" id="leaderboard">
        <!-- Teams injected by JS -->
      </div>
    </section>

    <section class="teams-detail-section">
      <h2 class="section-title">
        <span class="title-icon">▸</span>
        TEAM ROSTERS & INDIVIDUAL SCORES
      </h2>
      <div class="teams-detail-grid" id="teamsDetail">
        <!-- Team cards injected by JS -->
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>Data fetched from <a href="https://play.picoctf.org" target="_blank" rel="noopener">play.picoctf.org</a></p>
    <p class="last-update">Last updated: <span id="lastUpdate">—</span></p>
  </footer>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loader">
      <div class="loader-ring"></div>
      <span class="loader-text">FETCHING SCORES...</span>
    </div>
  </div>

  <script>
const TEAM_IDS = [19336, 19570, 19329, 19338];
const API_BASE = 'https://play.picoctf.org/api/teams';
const CORS_PROXIES = [
  'https://api.cors.lol/?url=',
  'https://api.allorigins.win/raw?url=',
  'https://corsproxy.io/?url=',
];

const elements = {
  leaderboard: document.getElementById('leaderboard'),
  teamsDetail: document.getElementById('teamsDetail'),
  loadingOverlay: document.getElementById('loadingOverlay'),
  refreshBtn: document.getElementById('refreshBtn'),
  lastUpdate: document.getElementById('lastUpdate'),
  eventName: document.getElementById('eventName'),
};

async function fetchTeamData(teamId) {
  const targetUrl = `${API_BASE}/${teamId}`;
  let lastErr;
  for (const proxy of CORS_PROXIES) {
    try {
      const url = proxy + encodeURIComponent(targetUrl);
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr;
}

async function fetchAllTeams() {
  const results = await Promise.allSettled(TEAM_IDS.map(fetchTeamData));
  const teams = [];
  results.forEach((r, i) => {
    if (r.status === 'fulfilled') teams.push(r.value);
    else console.error(`Failed team ${TEAM_IDS[i]}:`, r.reason);
  });
  return teams;
}

function sortTeamsByScore(teams) {
  return [...teams].sort((a, b) => (b.team_score || 0) - (a.team_score || 0));
}

function renderLeaderboard(teams) {
  const sorted = sortTeamsByScore(teams);
  elements.leaderboard.innerHTML = sorted
    .map((team, index) => {
      const rank = index + 1;
      const rankClass = rank <= 3 ? `rank-${rank}` : '';
      const teamUrl = `https://play.picoctf.org/teams/${team.id}`;
      return `
        <article class="team-card ${rankClass}" data-rank="${rank}">
          <span class="rank-badge">#${rank}</span>
          <h3 class="team-name">${escapeHtml(team.name)}</h3>
          <p class="team-score">${formatScore(team.team_score)} pts</p>
          <a class="team-link" href="${teamUrl}" target="_blank" rel="noopener">View on picoCTF →</a>
        </article>
      `;
    })
    .join('');
}

function renderTeamDetails(teams) {
  const sorted = sortTeamsByScore(teams);
  elements.teamsDetail.innerHTML = sorted
    .map((team) => {
      const members = (team.members || [])
        .filter((m) => !m.is_disqualified)
        .sort((a, b) => (b.team_score_contribution || 0) - (a.team_score_contribution || 0));

      const membersHtml = members
        .map(
          (m) => `
          <div class="member-row">
            <div class="member-info">
              <span class="member-username">${escapeHtml(m.username)}</span>
              ${m.team_leader ? '<span class="member-leader-badge">LEADER</span>' : ''}
            </div>
            <span class="member-score">${formatScore(m.team_score_contribution)} pts</span>
          </div>
        `
        )
        .join('');

      return `
        <article class="team-detail-card">
          <div class="team-detail-header">
            <span class="team-detail-name">${escapeHtml(team.name)}</span>
            <span class="team-detail-total">${formatScore(team.team_score)} pts</span>
          </div>
          <div class="members-list">
            ${membersHtml || '<p style="color: var(--text-muted); font-size: 0.85rem;">No members</p>'}
          </div>
        </article>
      `;
    })
    .join('');
}

function formatScore(value) {
  const n = Number(value);
  return isNaN(n) ? '0' : n.toLocaleString();
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function loadLeaderboard() {
  elements.loadingOverlay?.classList.remove('hidden');
  elements.refreshBtn?.classList.add('loading');

  try {
    const teams = await fetchAllTeams();

    if (teams.length === 0) {
      elements.leaderboard.innerHTML = `
        <div class="error-message" style="grid-column: 1/-1;">
          Failed to load team data. Check console for details.
        </div>
      `;
      return;
    }

    if (teams[0]?.event?.name) {
      elements.eventName.textContent = teams[0].event.name;
    }

    renderLeaderboard(teams);
    renderTeamDetails(teams);
    elements.lastUpdate.textContent = new Date().toLocaleString();
  } catch (err) {
    console.error('Leaderboard load error:', err);
    elements.leaderboard.innerHTML = `
      <div class="error-message" style="grid-column: 1/-1;">
        Error loading leaderboard: ${escapeHtml(err.message)}
      </div>
    `;
  } finally {
    elements.loadingOverlay?.classList.add('hidden');
    elements.refreshBtn?.classList.remove('loading');
  }
}

elements.refreshBtn?.addEventListener('click', loadLeaderboard);
loadLeaderboard();
  </script>
</body>
</html>
