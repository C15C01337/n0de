
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>
      Nepal Election Live Dashboard
    </title>
    <style>
      body{
font-family:system-ui;
background:#eef2f7;
margin:0;
padding:30px;
}

h1{
text-align:center;
margin-bottom:10px;
}

.status{
text-align:center;
color:#666;
margin-bottom:30px;
}

#dashboard{
display:flex;
flex-wrap:wrap;
gap:25px;
justify-content:center;
}

.card{
background:white;
width:360px;
border-radius:12px;
box-shadow:0 8px 25px rgba(0,0,0,0.08);
padding:18px;
transition:0.3s;
}

.card:hover{
transform:translateY(-3px);
box-shadow:0 12px 30px rgba(0,0,0,0.15);
}

.card h3{
margin-top:0;
color:#1a73e8;
}

.list{
max-height:260px;
overflow-y:auto;
margin-top:10px;
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 0;
border-bottom:1px solid #eee;
}

.row:last-child{
border:none;
}

.rank{
font-weight:bold;
width:25px;
color:#888;
}

.name{
font-weight:600;
display: flex;
align-items: center;
gap: 6px;
}

.party{
font-size:12px;
color:#777;
}

.vote{
font-weight:bold;
background:#ecfdf5;
color:#059669;
padding:4px 10px;
border-radius:6px;
}

.winner{
background:#fff7ed;
}

/* New CSS for the Elected Badge */
.elected-badge {
background: #10b981;
color: white;
font-size: 10px;
padding: 2px 6px;
border-radius: 4px;
font-weight: bold;
text-transform: uppercase;
letter-spacing: 0.5px;
}

.vote-progress{
margin:10px 0 14px;
}

.vote-progress-head{
display:flex;
justify-content:space-between;
font-size:12px;
color:#555;
margin-bottom:6px;
font-weight:600;
}

.vote-progress-track{
height:10px;
background:#e5e7eb;
border-radius:999px;
overflow:hidden;
}

.vote-progress-fill{
height:100%;
width:0;
background:linear-gradient(90deg,#16a34a,#22c55e);
transition:width 0.4s ease;
}

.vote-progress-note{
font-size:11px;
color:#888;
margin-top:6px;
}
    </style>
  </head>
  <body>
    <h1>
      Nepal Election Live Dashboard
    </h1>
    <div class="status" id="last-updated">
      Loading...
    </div>
    <div id="dashboard">
    </div>
    <script>
      const urls = [

"https://election.ekantipur.com/pradesh-5/district-rukumeast/constituency-1?lng=eng",
"https://election.ekantipur.com/pradesh-1/district-jhapa/constituency-5?lng=eng",
"https://election.ekantipur.com/pradesh-1/district-sunsari/constituency-1?lng=eng",
"https://election.ekantipur.com/pradesh-5/district-rupandehi/constituency-2?lng=eng",
"https://election.ekantipur.com/pradesh-3/district-chitwan/constituency-2?lng=eng",
"https://election.ekantipur.com/pradesh-5/district-arghakhanchi/constituency-1?lng=eng",
"https://election.ekantipur.com/pradesh-3/district-bhaktapur/constituency-2?lng=eng",
"https://election.ekantipur.com/pradesh-3/district-chitwan/constituency-3?lng=eng",
"https://election.ekantipur.com/pradesh-5/district-gulmi/constituency-1?lng=eng",
"https://election.ekantipur.com/pradesh-3/district-kathmandu/constituency-3?lng=eng"];

const totalCastedVotesByUrl={
"https://election.ekantipur.com/pradesh-5/district-rukumeast/constituency-1?lng=eng":18604,
"https://election.ekantipur.com/pradesh-1/district-jhapa/constituency-5?lng=eng":106310,
"https://election.ekantipur.com/pradesh-1/district-sunsari/constituency-1?lng=eng":87865,
"https://election.ekantipur.com/pradesh-5/district-rupandehi/constituency-2?lng=eng":86715,
"https://election.ekantipur.com/pradesh-3/district-chitwan/constituency-2?lng=eng":87221,
"https://election.ekantipur.com/pradesh-5/district-arghakhanchi/constituency-1?lng=eng":87477,
"https://election.ekantipur.com/pradesh-3/district-bhaktapur/constituency-2?lng=eng":97477,
"https://election.ekantipur.com/pradesh-3/district-chitwan/constituency-3?lng=eng":100053,
"https://election.ekantipur.com/pradesh-5/district-gulmi/constituency-1?lng=eng":122186,
"https://election.ekantipur.com/pradesh-3/district-kathmandu/constituency-3?lng=eng":64479
};

function getTitle(url){

const parts=url.split("/");
const district=parts[parts.length-2].replace("district-","");
const constituency=parts[parts.length-1].split("?")[0].replace("constituency-","");

return district+" Constituency "+constituency;

}

function cleanVotes(text){

if(!text) return "0";

const match=text.match(/\d{1,3}(,\d{3})*/);

return match ? match[0] : "0";

}

function votesToNumber(votes){

return Number(String(votes||"0").replace(/,/g,""))||0;

}

async function fetchHTML(url){

const proxy="https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(url);

const res=await fetch(proxy);

return await res.text();

}

function parse(html){

const parser=new DOMParser();
const doc=parser.parseFromString(html,"text/html");

const rows=doc.querySelectorAll("tr");

const results=[];

rows.forEach(row=>{

const cells=row.querySelectorAll("td");

if(cells.length>=3){

const name=cells[0].innerText.trim();
const party=cells[1].innerText.trim();
const rawVotes=cells[2].innerText;
const votes=cleanVotes(rawVotes);

// Check if the word "Elected" is anywhere in the row's text
const isElected=row.innerText.includes("Elected");

results.push({name,party,votes,isElected});

}

});

return results;

}

function renderCard(id,title){

const dashboard=document.getElementById("dashboard");

const card=document.createElement("div");
card.className="card";

card.innerHTML=`
<h3>${title}</h3>
<div class="vote-progress" id="vote-progress-${id}"></div>
<div class="list" id="list-${id}">Loading...</div>
`;

dashboard.appendChild(card);

}

function updateTable(id,candidates,url){

const list=document.getElementById("list-"+id);
const progress=document.getElementById("vote-progress-"+id);

const countedVotes=candidates.reduce((sum,c)=>sum+votesToNumber(c.votes),0);
const totalCastedVotes=totalCastedVotesByUrl[url];
const hasTotal=Number.isFinite(totalCastedVotes)&&totalCastedVotes>0;

if(hasTotal){

const percentage=Math.min((countedVotes/totalCastedVotes)*100,100);

progress.innerHTML=`
<div class="vote-progress-head">
<span>Total Casted Vote</span>
<span>${countedVotes.toLocaleString()} / ${totalCastedVotes.toLocaleString()} (${percentage.toFixed(1)}%)</span>
</div>
<div class="vote-progress-track">
<div class="vote-progress-fill" style="width:${percentage}%"></div>
</div>
`;

}else{

progress.innerHTML=`
<div class="vote-progress-head">
<span>Total Casted Vote</span>
<span>${countedVotes.toLocaleString()}</span>
</div>
<div class="vote-progress-note">Set total casted vote in totalCastedVotesByUrl for percentage progress.</div>
`;

}

let html="";

candidates.forEach((c,i)=>{

const winner=i===0?"row winner":"row";
const electedTag=c.isElected?`<span class="elected-badge">Elected</span>`:"";

html+=`
<div class="${winner}">

<div style="display:flex;gap:8px;align-items:center">

<div class="rank">#${i+1}</div>

<div>
<div class="name">${c.name} ${electedTag}</div>
<div class="party">${c.party}</div>
</div>

</div>

<div class="vote">${c.votes}</div>

</div>
`;

});

list.innerHTML=html;

}

async function update(){

for(let i=0;i<urls.length;i++){

const html=await fetchHTML(urls[i]);

const candidates=parse(html);

updateTable(i,candidates,urls[i]);

}

const now=new Date();

document.getElementById("last-updated").innerText="Last Updated: "+now.toLocaleTimeString();

}

function init(){

urls.forEach((url,i)=>{

renderCard(i,getTitle(url));

});

update();

setInterval(update,20000);

}

init();
    </script>
  </body>
</html>
